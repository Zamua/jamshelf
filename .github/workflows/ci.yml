name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # macOS arm64: package.json pins darwin-arm64 native bindings as devDependencies.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
